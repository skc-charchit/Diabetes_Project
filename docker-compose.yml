services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: "8000"
      MODEL_PATH: /app/src/models/diabetes_pipeline.pkl
      METRICS_PATH: /app/src/models/training_metrics.json
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  ui:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    environment:
      API_URL: http://api:8000
    ports:
      - "${UI_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy