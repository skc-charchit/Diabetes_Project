[project]
name = "diabetes-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"fastapi",
	"joblib",
	"numpy",
	"pandas",
	"pydantic",
	"scikit-learn",
	"uvicorn",
]

[project.optional-dependencies]
ui = ["streamlit"]
notebooks = ["matplotlib", "seaborn"]

[dependency-groups]
dev = ["httpx2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
